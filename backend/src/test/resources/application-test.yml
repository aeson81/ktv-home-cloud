spring:
  datasource:
    url: jdbc:h2:mem:ktvtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false          # 骨架阶段测试暂不建表；后续迁移任务开启专用迁移测试
