<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭KTV（含网盘）</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #17133b; color: #fff; margin: 0; padding: 32px 20px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.desc { color: #b9b3d9; font-size: 14px; margin: 0 0 24px; }
  a.card { display: block; background: #221d4e; border-radius: 12px;
           padding: 16px 18px; margin-bottom: 12px; color: #fff;
           text-decoration: none; border: 1px solid #35306b; }
  a.card:hover { background: #2b2560; }
  a.card b { font-size: 17px; display: block; margin-bottom: 4px; }
  a.card span { font-size: 13px; color: #b9b3d9; word-break: break-all; }
  .foot { margin-top: 24px; font-size: 12px; color: #8f89b8; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>家庭KTV（含网盘）</h1>
  <p class="desc">电视负责播放，手机扫码点歌；百度网盘 / OneDrive / 115 可挂载为只读曲库源。</p>
  <div id="links"></div>
  <div class="foot">
    网盘挂载步骤：先在「alist 网盘管理」中添加百度网盘 / OneDrive / 115（账号 admin，密码见安装日志），
    再到「管理后台」→ 仪表盘点「扫描源路径」，网盘歌曲就会进入「原始音乐管理」。
  </div>
</div>
<script>
(function () {
  var h = location.hostname;
  var items = [
    ["手机点歌", "微信扫码电视上的二维码，或直接打开此页", "http://" + h + ":8080/m"],
    ["管理后台", "曲库、转码、扫描入库", "http://" + h + ":8080/m/admin"],
    ["alist 网盘管理", "添加百度网盘 / OneDrive / 115", "http://" + h + ":5244"]
  ];
  var box = document.getElementById("links");
  items.forEach(function (it) {
    var a = document.createElement("a");
    a.className = "card";
    a.href = it[2];
    a.target = "_blank";
    a.rel = "noopener";
    var b = document.createElement("b");
    b.textContent = it[0];
    var s = document.createElement("span");
    s.textContent = it[1] + " · " + it[2];
    a.appendChild(b);
    a.appendChild(s);
    box.appendChild(a);
  });
})();
</script>
</body>
</html>
