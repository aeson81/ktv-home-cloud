name: Build TV APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "TV APK version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "tv-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/tv-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/tv-v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build release APKs
        working-directory: android-tv
        env:
          KTV_TV_VERSION_NAME: ${{ steps.ver.outputs.version }}
          KTV_TV_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          VER=${{ steps.ver.outputs.version }}
          mkdir -p dist/tv-apk
          find android-tv/app/build/outputs/apk -name "*armeabi-v7a*release.apk" -exec cp {} dist/tv-apk/home-ktv-tv-${VER}-armeabi-v7a.apk \;
          find android-tv/app/build/outputs/apk -name "*arm64-v8a*release.apk" -exec cp {} dist/tv-apk/home-ktv-tv-${VER}-arm64-v8a.apk \;
          ls -lh dist/tv-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk-${{ steps.ver.outputs.version }}
          path: dist/tv-apk/*.apk
          retention-days: 30
