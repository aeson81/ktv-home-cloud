name: Release All (fpk + APK)

# 一键发布：同时构建 fpk 安装包和 Android TV APK，发布到同一个 GitHub Release。
# 在 Actions 页面点 "Run workflow"，输入版本号（如 1.0.0），即可生成。
# Release 中包含：ktv-home-cloud.fpk + tv-apk (armeabi-v7a + arm64-v8a)。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.0.0）"
        default: "1.0.0"
        required: true
  push:
    tags: ["release-v*"]

permissions:
  contents: write
  packages: write

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    outputs:
      fpk-name: ${{ steps.build.outputs.fpk-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push KTV image
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#release-v}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg BASE_REGISTRY=docker.m.daocloud.io \
            -f backend/Dockerfile \
            -t ghcr.io/aeson81/ktv-home-cloud:latest \
            -t ghcr.io/aeson81/ktv-home-cloud:${VERSION} \
            --push .

      - name: Prepare fnpack (vendored, checksum verified)
        run: |
          echo "54b97fa7b70968c4d05c79840f5daefff508957d0bb2062fdb0376d00d9615c93  tools/fnpack-linux-amd64" | sha256sum -c -
          chmod +x tools/fnpack-linux-amd64
          cp tools/fnpack-linux-amd64 fnpack

      - name: Build fpk
        id: build
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#release-v}"
          # 写入版本号到 manifest
          sed -i "s/^version=.*/version=${VERSION}/" packaging/fnos/manifest 2>/dev/null || true
          ./fnpack build --directory packaging/fnos
          FPK=$(ls ./*.fpk | head -1)
          echo "fpk-name=${FPK}" >> $GITHUB_OUTPUT
          ls -lh ./*.fpk

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk
          path: ./*.fpk

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Build TV APK (debug, both ABIs)
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#release-v}"
          cd android-tv
          ./gradlew assembleDebug -PtvVersionName=${VERSION} --no-daemon
          find app/build/outputs/apk -name "*.apk" | head -10

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: android-tv/app/build/outputs/apk/debug/*.apk

  release:
    needs: [build-fpk, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#release-v}"
          TAG="v${VERSION}"
          # 创建或获取 Release
          gh release view "${TAG}" > /dev/null 2>&1 || gh release create "${TAG}" \
            --title "K无限 v${VERSION}" \
            --notes "K无限家庭KTV v${VERSION}：fpk 安装包 + Android TV APK（armeabi-v7a/arm64-v8a）"
          # 上传文件
          find ./artifacts -type f \( -name "*.fpk" -o -name "*.apk" \) -exec gh release upload "${TAG}" --clobber {} \;
          echo "Release ${TAG} published"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
